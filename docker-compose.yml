# 默认只起 price-radar 常驻监控；n8n 可视化编排用 --profile n8n 额外启动
services:
  price-radar:
    build: .
    image: price-radar:local
    container_name: price-radar
    restart: unless-stopped
    environment:
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK:-}
      - FEISHU_SECRET=${FEISHU_SECRET:-}
      - TZ=Asia/Shanghai
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ./out:/app/out
    command: ["python", "-m", "price_radar", "watch", "--interval", "7200"]

  n8n:
    profiles: ["n8n"]
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./n8n:/home/node/workflows:ro
